name: Daily Pipeline

on:
  schedule:
    - cron: '0 2 * * *'  # 02:00 UTC, after CoinGecko publishes the midnight prices
  workflow_dispatch:
    inputs:
      skip_backtest:
        description: Skip the yearly backtest
        type: boolean
        default: false

concurrency:
  group: daily-pipeline
  cancel-in-progress: false

jobs:
  pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Install dependencies
        run: pip install -r requirements-pipeline.txt

      - name: Run pipeline
        run: python -m pricepredict.pipeline ${{ inputs.skip_backtest && '--skip-backtest' || '' }}
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          COINGECKO_API_KEY: ${{ secrets.COINGECKO_API_KEY }}
